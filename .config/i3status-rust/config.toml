icons_format = "{icon}"

[theme]
theme = "solarized-dark"
[theme.overrides]
idle_bg = "#123456"
idle_fg = "#abcdef"

[icons]
icons = "awesome4"
[icons.overrides]
bat = ["|E|", "|_|", "|=|", "|F|"]
bat_charging = "|^| "

[[block]]
block = "battery"
interval = 60
format = " $icon $percentage $time "

[[block]]
block = "sound"

[[block]]
block = "backlight"
format = " $icon $brightness "
step_width = 5

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%Y-%m-%d %H:%M') "
